<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Taglia-notizie</title>
<meta name="description" content="Taglia una frase, lettera per lettera, fino a crearne una nuova.">
<meta name="theme-color" content="#f6f1e7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/taglianotizie/style.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <h1>✂️ Taglia&#8209;notizie</h1>
    <p class="tagline">Taglia una notizia in pezzi, lettera per lettera.</p>
  </header>

  <section class="panel">
    <label for="original-input">Notizia iniziale</label>
    <textarea id="original-input" rows="3" spellcheck="false">La tua notizia qui</textarea>
    <div class="panel-actions">
      <button id="load-btn" class="btn btn-primary" type="button">Carica notizia</button>
      <button id="reset-btn" class="btn" type="button">Azzera tagli</button>
    </div>
  </section>

  <section class="panel">
    <div class="display-label-row">
      <label>Risultato</label>
      <span class="hint hint-desktop">Digita una lettera per tagliare, o clicca nel testo per accettare tutto fino a lì</span>
      <span class="hint hint-mobile">Tocca una lettera sulla tastiera per tagliare, o direttamente nel testo per accettare tutto fino a lì</span>
    </div>
    <div id="display" class="display" tabindex="0" aria-label="Area di taglio. Digita una lettera per tagliare alla sua prima occorrenza, oppure clicca direttamente su una lettera del testo per accettare tutto il testo fino a quel punto. Clicca su una lettera già accettata per tornare a quel punto."></div>
    <div class="panel-actions">
      <button id="copy-btn" class="btn btn-primary" type="button">📋 Copia risultato</button>
      <button id="backspace-btn" class="btn" type="button" aria-label="Annulla l'ultimo taglio">⌫ Annulla</button>
      <button id="enter-btn" class="btn" type="button" aria-label="Taglia il resto">⏎ Taglia resto</button>
    </div>
    <p id="toast" class="toast" role="status" hidden></p>
  </section>

</div>

<div id="mobile-keyboard" class="mobile-keyboard" aria-hidden="true"></div>

<script src="/taglianotizie/script.js" defer></script>
</body>
</html>
